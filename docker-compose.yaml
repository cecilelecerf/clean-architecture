services:
  mysql:
    image: mysql:8.0
    container_name: myapp_mysql
    restart: always
    env_file:
      - ./.env
    ports:
      - "3307:3306"
    volumes:
      - ./docker/mysql/data:/var/lib/mysql
      - ./infrastructure/src/adapters/db/mysql/schemas:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password
  phpmyadmin:
    image: phpmyadmin
    container_name: myapp_phpmyadmin
    restart: always
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "8081:80"
  
  db_mongo:
    image: mongo:latest
    restart: always
    ports:
      - 27400:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: true5ecur3
